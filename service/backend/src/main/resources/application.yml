server:
  port: 8081
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: leaf-rpa-service
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/leaf_rpa?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: leaf
    password: leaf_rpa_dev
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 8
      minimum-idle: 2
  jpa:
    # 表结构完全由 service/sql/init-db.sql 管理，服务端不建表不改表
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

leaf:
  jwt:
    # 开发密钥；生产部署时必须通过环境变量 LEAF_JWT_SECRET 覆盖
    secret: ${LEAF_JWT_SECRET:leaf-rpa-dev-secret-please-override-in-production-0123456789}
    expire-hours: 168
  flow-store:
    # .leafrpa 流程文件存储目录
    dir: ${LEAF_FLOW_DIR:./data/flows}

logging:
  level:
    com.leafrpa.service: info
